<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>02 — Displaying a .glb Mesh</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('light-toggle', {
      schema: {
        target: { type: 'selector' }
      },

      init() {
        this.lightsOn = true;
        this.el.addEventListener('click', () => {
          this.lightsOn = !this.lightsOn;

          this.data.target.object3D.traverse(object => {
            if (object.isLight) {
              object.visible = this.lightsOn;
            }
          });

          this.el.setAttribute(
            'color',
            this.lightsOn ? '#FFD700' : '#555555'
          );
        });
      }
    });

    AFRAME.registerComponent('camera-bob', {
      schema: {
        amount: { type: 'number', default: 0.035 },
        speed: { type: 'number', default: 10 },
        smoothing: { type: 'number', default: 12 }
      },

      init() {
        this.baseY = this.el.object3D.position.y;
        this.lastPosition = this.el.object3D.position.clone();
        this.phase = 0;
      },

      tick(time, delta) {
        const position = this.el.object3D.position;
        const moving = position.distanceTo(this.lastPosition) > 0.0001;
        const elapsed = delta / 1000;

        if (moving) {
          this.phase += elapsed * this.data.speed;
          position.y = this.baseY + Math.sin(this.phase) * this.data.amount;
        } else {
          position.y += (this.baseY - position.y) * Math.min(elapsed * this.data.smoothing, 1);
        }

        this.lastPosition.copy(position);
      }
    });
  </script>
</head>
<body>

  <a-scene background="color: #202025">

    <!--
      ============ ASSETS ============
      <a-assets> is A-Frame's asset management system. Anything declared
      here is pre-fetched and cached BEFORE the scene starts rendering,
      which avoids models/textures popping in late or reloading when
      reused by multiple entities. Reference it elsewhere with #id.
    -->
    <a-assets>
      <a-asset-item id="room-model" src="PolyCamProj.glb"></a-asset-item>
      <audio id="slab-audio" src="audio.mp3/audio-slab.mp3" preload="auto"></audio>
    </a-assets>

    <!--
      ============ THE MESH ============
      The `gltf-model` component loads glTF/.glb files (the standard,
      efficient format for transmitting 3D models on the web). We point
      it at the asset above with #duck-model rather than the raw path,
      so it reuses the cached, already-fetched copy.

      glTF files are exported in "real-world" meters, which is often much
      bigger or smaller than you expect — `scale` is normal to need.
    -->
    <a-entity
      gltf-model="#room-model"
      position="3 0 2"
      scale="1.5 1.5 1.5"
      rotation="0 180 0">
    </a-entity>

    <!-- Ground + lighting so the model has something to sit on and read as 3D. -->
    <a-plane rotation="-90 0 0" width="20" height="20" color="#E0D2AD"></a-plane>
    <a-plane rotation="-90 0 0" width="20" height="20" color="#E0D2AD"></a-plane>
    <a-entity light="type: ambient; color: #BBB"; intensity: 27></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 2S" position="2 1 1"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 2S" position="2 3 1"></a-entity>
    <a-sky color="#202025"></a-sky>

    <a-entity id="room-lights">

      <a-entity
        light="type: directional; color: #FFF; intensity: 2"
        position="2 3 1">
      </a-entity>

      <a-entity
        light="type: directional; color: #FFF; intensity: 5"
        position="2 3 2">
      </a-entity>
    </a-entity>

    <a-sphere
      id="glowing-sphere"
      position="0.8 1.2 2"
      radius="0.12"
      material="color: #FFD166; emissive: #FFD166; emissiveIntensity: 5">
      <a-entity
        light="type: point; color: #FFD166; intensity: 2; distance: 5; decay: 2">
      </a-entity>
    </a-sphere>

    <a-cylinder
      light-toggle="target: #room-lights"
      position="2.1 1.45 -3.4"
      radius="0.1"
      height="0.2"
      color="#FFD700"
      class="clickable">
    </a-cylinder>

    <a-box
      id="audio-slab"
      position="1.07 1.15 -1"
      width="0.2"
      height="0.05"
      depth="0.2"
      color="#202025"
      class="clickable"
      sound="src: #slab-audio; on: click; volume: 2">
    </a-box>

    <a-entity
      camera
      look-controls
      wasd-controls="acceleration:10"
      camera-bob
      position="1 1.6 2">
      <a-cursor raycaster="objects: .clickable"></a-cursor>
    </a-entity>

  </a-scene>

</body>
</html>
